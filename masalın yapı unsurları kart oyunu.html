<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masalın Yapı Unsurları Kart Oyunu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Quicksand:wght@400;600;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: #0a0a2a; /* Velvet dark blue */
            color: white;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        h1, h2, h3, .cinzel {
            font-family: 'Cinzel', serif;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        
        @keyframes bgCardFloat {
            0% { transform: translateY(110vh) rotate(-15deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-20vh) rotate(25deg) scale(1.2); opacity: 0; }
        }

        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.5); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake-active {
            animation: shake 0.5s;
        }

        .gold-box {
            background: linear-gradient(to right, #eab308, #ca8a04);
            box-shadow: 0 0 15px gold;
            color: #1a1a1a;
            border: 2px solid gold;
        }

        .card-bg {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .option-btn {
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.95);
            color: #111;
        }
        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .correct-answer { background: #4ade80 !important; color: white !important; box-shadow: 0 0 20px #4ade80 !important; border: none; }
        .wrong-answer { background: #f87171 !important; color: white !important; box-shadow: 0 0 20px #f87171 !important; border: none; }

        .ghost-card {
            position: absolute;
            width: 140px;
            height: 190px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            z-index: 0;
            pointer-events: none;
        }
        
        .sparkle {
            position: absolute;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 10px white, 0 0 20px gold;
            pointer-events: none;
            z-index: 1;
        }

        .diamond-particle {
            position: fixed;
            font-size: 2.5rem;
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            filter: drop-shadow(0 0 15px cyan);
        }

        .scale-in { animation: scaleIn 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .scale-out { animation: scaleOut 0.4s forwards ease-in; }
        
        @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes scaleOut { from { transform: scale(1); opacity: 1; } to { transform: scale(0); opacity: 0; } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body id="game-body" class="h-screen w-screen relative flex flex-col">

    <div id="bg-layer" class="absolute inset-0 z-0 overflow-hidden pointer-events-none"></div>

    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#0a0a2a]/95 backdrop-blur-sm">
        <h1 class="cinzel text-5xl md:text-7xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-yellow-300 mb-8 drop-shadow-[0_0_15px_rgba(255,215,0,0.5)]">
            Masalın Yapı Unsurları<br>Kart Oyunu
        </h1>
        <div class="card-bg p-8 rounded-2xl flex flex-col items-center max-w-md w-full mx-4 text-center">
            <h2 class="text-2xl mb-6">Oyuna Başla</h2>
            <label class="mb-2 text-lg text-gray-300">Kaç grup yarışacak? (2-5)</label>
            <input type="number" id="group-count" min="2" max="5" value="2" class="w-24 text-center text-3xl p-2 rounded-xl text-black font-bold mb-6 focus:outline-none focus:ring-4 focus:ring-yellow-400">
            <button onclick="startGame()" class="gold-box px-8 py-4 rounded-xl text-xl font-bold cinzel hover:scale-105 transition-transform w-full">Oyunu Başlat</button>
        </div>
    </div>

    <div id="game-ui" class="hidden flex-col h-full z-10 p-4">
        
        <!-- Top Bar & Scoreboard -->
        <div class="w-full max-w-7xl mx-auto mb-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="card-bg px-6 py-3 rounded-xl border-l-4 border-yellow-400 shadow-lg">
                    <h2 class="cinzel text-2xl font-bold tracking-wider text-yellow-300" id="turn-display">Sıra: 1. Grup</h2>
                </div>
                <div id="scoreboard" class="flex flex-wrap justify-center gap-3 w-full md:w-auto">
                    <!-- Groups injected here -->
                </div>
            </div>
        </div>

        <div class="flex-grow flex flex-col items-center justify-center relative w-full max-w-5xl mx-auto mt-2 h-full overflow-hidden">
            
            <button id="btn-bring-card" onclick="bringCard()" class="gold-box px-12 py-6 rounded-full text-3xl font-bold cinzel hover:scale-110 transition-transform shadow-2xl animate-[float_3s_ease-in-out_infinite] z-20">
                Kart Getir
            </button>

            <!-- Active Card & Questions -->
            <div id="active-card" class="hidden flex-col items-center w-full max-h-full overflow-y-auto px-2 pb-20 custom-scroll">
                
                <!-- Story Text -->
                <div class="card-bg p-6 md:p-8 rounded-2xl w-full mb-6 relative">
                    <div class="absolute -top-10 -right-10 opacity-20 text-9xl pointer-events-none">📜</div>
                    <h3 id="story-title" class="cinzel text-2xl md:text-3xl font-bold text-yellow-400 mb-4 border-b border-white/20 pb-2">Başlık</h3>
                    <p id="story-text" class="text-lg md:text-xl leading-relaxed text-gray-100"></p>
                </div>

                <div class="gold-box w-full p-6 md:p-8 rounded-2xl relative shadow-2xl mt-4">
                    <div class="absolute -top-5 left-1/2 transform -translate-x-1/2 bg-[#0a0a2a] text-white px-8 py-2 rounded-full border-2 border-yellow-400 font-bold tracking-widest cinzel text-lg shadow-[0_0_10px_gold]" id="question-tag">OLAY</div>
                    <h4 id="question-title" class="text-2xl md:text-3xl font-bold text-center mt-4 mb-8 text-black">Bu metnin ... nedir?</h4>
                    <div id="options-container" class="flex flex-col gap-4">
                        <!-- Options injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- End Game Button -->
        <button onclick="endGame()" class="absolute bottom-6 right-6 card-bg px-6 py-3 rounded-xl text-red-300 hover:bg-red-900/80 hover:text-white transition-all border border-red-500/50 text-sm md:text-base font-bold shadow-lg z-30">
            Oyunu Bitir
        </button>
    </div>

    <div id="end-screen" class="hidden absolute inset-0 z-50 flex-col items-center justify-center bg-[#0a0a2a]/95 backdrop-blur-md">
        <h1 class="cinzel text-6xl md:text-7xl font-bold text-yellow-400 mb-8 animate-bounce drop-shadow-[0_0_20px_gold]">Oyun Bitti!</h1>
        <div class="card-bg p-8 md:p-12 rounded-3xl w-full max-w-3xl text-center shadow-[0_0_50px_rgba(255,215,0,0.4)] relative">
            <h2 class="text-4xl mb-8 text-white font-bold border-b border-white/20 pb-4 cinzel">Skor Tablosu</h2>
            <div id="final-scoreboard" class="flex flex-col gap-4 text-2xl">
                <!-- Final results injected here -->
            </div>
        </div>
        <button onclick="location.reload()" class="mt-12 bg-white/10 hover:bg-white/20 px-8 py-4 rounded-2xl border-2 border-white/30 transition-all font-bold text-xl hover:scale-105">Yeniden Oyna</button>
    </div>

    <script>
        const storyData = [
            {
                title: "1. Sihirli Ayva Tohumu",
                text: "Bir varmış bir yokmuş, uzak diyarların birinde verimli toprakları olan şirin bir köy varmış. Bu köyde yaşayan genç bir çiftçi, tarlasını sürerken parlayan, sihirli bir ayva tohumu bulmuş. Tohumu toprağa ektiği o gece, gökyüzünden süzülen bir yıldız perisi tohumu kutsamış. Ertesi sabah, tohumun yerinde altın yapraklı ve gümüş meyveli devasa bir ağaç duruyormuş. Çiftçi, bu ağacın meyveleriyle tüm köyü bolluğa kavuşturmuş.",
                olay: { c: "Çiftçinin bulduğu tohumun perinin kutsamasıyla büyüyerek köyü bolluğa kavuşturması.", w: ["Çiftçinin sihirli ayva tohumunu yiyerek periye dönüşmesi ve köyden ayrılması.", "Yıldız perisinin köye altın yapraklı bir ağaç tohumu satıp zengin olması."] },
                yer: { c: "Uzak diyarlarda şirin bir köy, tarla.", w: ["Uzak diyarlardaki yıldız perisi şatosu.", "Çiftçinin orman içindeki gizli kulübesi."] },
                zaman: { c: "Bir varmış bir yokmuş, o gece, ertesi sabah.", w: ["Bir varmış bir yokmuş, kırk gün kırk gece sonra.", "Geçen yılın ilkbahar aylarında."] },
                kisi: { c: "Genç çiftçi, yıldız perisi.", w: ["Yaşlı çiftçi, orman perisi.", "Genç çiftçi, sihirli altın yaprak."] }
            },
            {
                title: "2. Zümrüdüanka Kuşu ve Şifalı Su",
                text: "Evvel zaman içinde, Kafdağı'nın sarp kayalıklarında efsanevi Zümrüdüanka kuşu yaşarmış. Bir gün, amansız bir hastalığa yakalanan yaşlı kral için şifalı su bulmak üzere cesur bir şövalye yola koyulmuş. Yedi karanlık vadiyi aştıktan sonra kuşun yuvasına ulaşan şövalye, ona kılıcını sunmuş. Kuş, bu cesaretin karşısında kanatlarından bir tüy ve bir damla şifalı su vererek kralı iyileştirmiş.",
                olay: { c: "Şövalyenin hasta kral için Zümrüdüanka'ya ulaşıp ondan şifalı su alması.", w: ["Şövalyenin kılıcıyla Zümrüdüanka kuşunu yenip şifalı suyu zorla alması.", "Yaşlı kralın yedi karanlık vadiyi aşarak kuşun yuvasına gitmesi."] },
                yer: { c: "Kafdağı'nın sarp kayalıkları, yedi karanlık vadi, kuşun yuvası.", w: ["Kralın sarp kayalıklardaki şatosu.", "Kafdağı'nın karanlık ormanları ve nehirleri."] },
                zaman: { c: "Evvel zaman içinde, bir gün.", w: ["Evvel zaman içinde, her dolunay gecesi.", "Eski çağların karanlık bir kış gününde."] },
                kisi: { c: "Zümrüdüanka kuşu, yaşlı kral, cesur şövalye.", w: ["Zümrüdüanka kuşu, genç kral, bilge şövalye.", "Sihirli kılıç, yaşlı kral, Zümrüdüanka kuşu."] }
            },
            {
                title: "3. Altın Kalpli Balıkçı",
                text: "Zamanın birinde, uçsuz bucaksız Mavi Deniz'in kıyısındaki derme çatma bir kulübede yoksul bir balıkçı yaşarmış. Balıkçı, fırtınalı bir günde ağlarına takılan ve pulları yakut gibi parlayan denizkızını kıyamayıp suya geri bırakmış. Denizkızı, bu iyiliğin karşılığı olarak balıkçıya denizlerin dibindeki batık bir geminin yerini söylemiş. Balıkçı gemideki hazineyi bulmuş ama zenginliğinin çoğunu kasabadaki yoksullara dağıtmış.",
                olay: { c: "Balıkçının denizkızını serbest bırakması, bulduğu hazineyi yoksullarla paylaşması.", w: ["Denizkızının balıkçıyı su altındaki batık gemide yaşamaya ikna etmesi.", "Yoksul balıkçının denizkızının yakut pullarını satarak zengin olması."] },
                yer: { c: "Mavi Deniz'in kıyısı, kulübe, batık gem.", w: ["Yakut Deniz'in kıyısındaki büyük bir kasaba.", "Mavi Deniz'in derinliklerindeki denizkızı sarayı."] },
                zaman: { c: "Zamanın birinde, fırtınalı bir günde.", w: ["Zamanın birinde, güneşli bir sabah.", "Evvel zaman içinde, üç gün üç gece."] },
                kisi: { c: "Yoksul balıkçı, denizkızı, kasabadaki yoksullar.", w: ["Zengin balıkçı, denizkızı, gemi kaptanı.", "Yoksul balıkçı, batık gem, yakut balıkları."] }
            },
            {
                title: "4. Uçan Halı ve Kayıp Prens",
                text: "Çok eski çağlarda, gökyüzüne uzanan kuleleri olan Rüzgarlı Şehir'de bir prens aniden ortadan kaybolmuş. Sarayın terzisi olan kurnaz genç, tavan arasında bulduğu eski ve tozlu bir halının uçabildiğini fark etmiş. Gece yarısı halıya binen terzi, bulutların üzerindeki Devler Ülkesi'ne kadar uçmuş. Orada, zindana kapatılan prensi bulup halıya bindirerek şafak sökmeden saraya geri getirmiş.",

                yer: { c: "Rüzgarlı Şehir, tavan arası, Devler Ülkesi, zindan.", w: ["Bulutlu Şehir, saray bahçesi, Cüceler Ülkesi.", "Rüzgarlı Şehir'in gökyüzü kuleleri ve terzi dükkanı."] },
                zaman: { c: "Çok eski çağlarda, gece yarısı, şafak sökmeden.", w: ["Çok eski çağlarda, gündüz vakti, akşam olmadan.", "Günlerden bir gün, gece yarısı."] },
                kisi: { c: "Kurnaz genç terzi, kayıp prens, devler (dolaylı).", w: ["Cesur prens, yaşlı terzi, uçan halı.", "Kral, terzi çırağı, kurnaz dev."] }
            },
            {
                title: "5. Ormanın Gözetleyicisi Baykuş",
                text: "Günlerden bir gün, Fısıldayan Orman'ın derinliklerinde hayvanlar büyük bir kavgaya tutuşmuşlar. Nehrin suyunu kimin içeceği konusunda anlaşamayan kurtlar ve geyikler ormanın huzurunu bozmuş. Gecenin karanlığı çöktüğünde asırlık meşe ağacının dalında yaşayan Bilge Baykuş uyanmış. Gözlerinden saçtığı büyülü ışıkla herkesi sakinleştirmiş ve suyu adil bir şekilde paylaştırmış.",

                yer: { c: "Fısıldayan Orman, nehir kenarı, asırlık meşe ağacı.", w: ["Karanlık Orman, göl kenarı, çam ağacı.", "Fısıldayan Orman'ın dışındaki büyük nehir."] },
                zaman: { c: "Günlerden bir gün, gecenin karanlığı çöktüğünde.", w: ["Her gece yarısı, sabah olduğunda.", "Bir zamanlar, gündüz vakti."] },
                kisi: { c: "Kurtlar, geyikler, Bilge Baykuş.", w: ["Aslanlar, geyikler, Yaşlı Baykuş.", "Bilge Baykuş, meşe ağacı, nehir perisi."] }
            },
            {
                title: "6. Konuşan Ayna ve Gümüş Tarak",
                text: "Evvel zaman içinde, yedi tepeli bir krallıkta yaşayan kibirli kraliçe, odasındaki konuşan aynasına kimin daha güzel olduğunu sorup dururmuş. Bir sabah, ayna ona dağın eteğinde yaşayan oduncunun kızının daha güzel olduğunu söylemiş. Kraliçe, kılık değiştirerek kıza zehirli bir gümüş tarak hediye etmiş. Ancak ormandaki iyi kalpli cüceler kızı bulmuş ve tarağı saçından çıkararak onu ölüm uykusundan uyandırmış.",
                olay: { c: "Kraliçenin oduncunun kızını kıskanıp zehirlemesi ve cücelerin kızı kurtarması.", w: ["Oduncunun kızının kraliçenin konuşan aynasını çalarak cücelere götürmesi.", "Kraliçenin iyi kalpli cücelere zehirli gümüş tarak hediye etmesi."] },
                yer: { c: "Yedi tepeli krallık, dağın eteği, orman.", w: ["Yedi cücelerin krallığı, oduncunun sarayı.", "Dağın zirvesi, konuşan aynanın odası."] },
                zaman: { c: "Evvel zaman içinde, bir sabah.", w: ["Çok eski zamanlarda, gece yarısı.", "Bir kış günü, yedi gün yedi gece."] },
                kisi: { c: "Kibirli kraliçe, konuşan ayna, oduncunun kızı, iyi kalpli cüceler.", w: ["Kibirli kraliçe, oduncu, prens, cüceler.", "Kötü cadı, zehirli tarak, oduncunun kızı."] }

            {
                title: "7. Gökyüzü Korsanları ve Işık Kristali",

                zaman: { c: "Zamanın ötesinde, bir gece, güneş doğarken.", w: ["Geçen asırda, dolunay gecesi, öğle vakti.", "Bir varmış bir yokmuş, günlerce."] },
                kisi: { c: "Karanlık korsanlar, Rüzgar Çocuğu, kanatlı at.", w: ["Gökyüzü perileri, Rüzgar Çocuğu, korsan kaptanı.", "Karanlık korsanlar, Rüzgar Çocuğu, Işık Kristali."] }
            },
            {
                title: "8. Yeraltı Kraliçesi'nin Kolyesi",
                text: "Bir zamanlar, Yedi Kat Yerin Altı'nda hüküm süren Kraliçe'nin elmas kolyesi kaybolmuş. Yeryüzünde madencilik yapan fakir bir çocuk, toprağı kazarken parlayan bir taş bulmuş ve bunun o efsanevi kolye olduğunu anlamış. Hiç tereddüt etmeden mağaraların derinliklerine inerek kolyeyi Kraliçe'ye teslim etmiş. Kraliçe, çocuğun dürüstlüğüne hayran kalarak ona tükenmeyen bir altın kesesi hediye etmiş.",

                yer: { c: "Yedi Kat Yerin Altı, yeryüzü, mağaraların derinlikleri.", w: ["Yedi Kat Gökyüzü, kraliçenin sarayı, orman.", "Yeryüzü, elmas madeni, kasaba meydanı."] },
                zaman: { c: "Bir zamanlar.", w: ["Yedi gün yedi gece boyunca.", "Gelecek zamanların birinde."] },
                kisi: { c: "Yeraltı Kraliçesi, fakir madenci çocuk.", w: ["Kötü Kraliçe, zengin madenci.", "Yeraltı Kraliçesi, elmas kolye, madenci çocuk."] }
            },
            {
                title: "9. Ateş Ejderhası ve Kardan Adam",

                olay: { c: "Kavanozu kırılan Ayışığı Perisi'ne ateşböceklerinin ışıklarını vererek yardım etmesi.", w: ["Karanlıktan korkan çocukların Gölgeler Ormanı'na gidip sihirli kavanozu kırması.", "Ayışığı Perisi'nin ateşböceklerinin ışıklarını zorla alıp onları karanlıkta bırakması."] },
                yer: { c: "Gökyüzü, Gölgeler Ormanı.", w: ["Ay Sarayı, çocukların odası.", "Işık Vadisi, perilerin kasabası."] },

                yer: { c: "Kızgın Çöl'ün tam ortası, vaha.", w: ["Yağmur Ormanları, bulutların sarayı.", "Serap Vadisi, gökyüzü okyanusu."] },
                zaman: { c: "Çok eskiden.", w: ["Bir zamanlar, kırk gün kırk gece.", "Evvel zaman içinde, ilkbaharda."] },
                kisi: { c: "Sihirli Çöl Gülü, minik Yağmur Bulutu.", w: ["Çöl kervanı, büyük bulutlar.", "Çöl Gülü, güneş perisi, kum canavarı."] }
            },
            {
                title: "30. Uçan Kitap ve Genç Bilgin",
                text: "Zamanın birinde, sonsuz rafları olan Bilgelik Kulesi'nde kanat çırpan uçan bir kitap varmış. Bu kitabın sayfalarında evrenin en büyük sırları yazılıymış ama kimse onu yakalayamıyormuş. Genç ve sabırlı bir bilgin, kitabı zorla yakalamak yerine yere oturup ona güzel ninniler söylemeye başlamış. Kitap yavaşça süzülerek bilginin kucağına konmuş ve sırlarını ona açmış.",
                olay: { c: "Genç bilginin ninni söyleyerek yakalanamayan uçan kitabı sakince yanına çekmesi.", w: ["Uçan kitabın kuledeki tüm bilgileri silerek kuleyi terk etmesi.", "Genç bilginin uçan kitabı dev bir ağ ile avlayarak zorla sırlarını öğrenmesi."] },
                yer: { c: "Bilgelik Kulesi.", w: ["Sihirli Kütüphane'nin gizli zindanı.", "Bilginin köydeki çalışma odası."] },
                zaman: { c: "Zamanın birinde.", w: ["Evvel zaman içinde, gece yarısı.", "Günlerden bir gün, saat on ikide."] },
                kisi: { c: "Genç bilgin, uçan kitap.", w: ["Yaşlı kütüphaneci, sihirli kitap, kral.", "Uçan kitap, büyücü, raflar."] }
            }
        ];

        let groupsCount = 2;
        let scores = [];
        let currentGroupIndex = 0;
        
        let remainingCards = [...Array(30).keys()];
        let currentCardData = null;
        
        // Define exact question stages
        const stages = [
            { key: 'olay', title: 'OLAYI' },
            { key: 'kisi', title: 'KİŞİSİ (VARLIK KADROSU)' },
            { key: 'yer', title: 'YERİ (MEKANI)' },
            { key: 'zaman', title: 'ZAMANI' }
        ];
        let currentStageIndex = 0;

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCorrectSound() {
            if(!audioCtx) return;
            // Relaxing Chime (C major arpeggio)
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + i * 0.1 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 1);
                osc.stop(audioCtx.currentTime + i * 0.1 + 1);
            });
        }

        function playWrongSound() {
            if(!audioCtx) return;
            // Dissonant sound (C4, Db4, Gb4)
            const freqs = [261.63, 277.18, 369.99];
            freqs.forEach((freq) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.stop(audioCtx.currentTime + 0.6);
            });
        }

        function createBackgroundEffects() {
            const bgLayer = document.getElementById('bg-layer');
            bgLayer.innerHTML = ''; // Clear previous
            // Sparkles
            for(let i=0; i<35; i++) {
                let spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.style.width = Math.random() * 4 + 2 + 'px';
                spark.style.height = spark.style.width;
                spark.style.left = Math.random() * 100 + 'vw';
                spark.style.top = Math.random() * 100 + 'vh';
                spark.style.animation = `sparkleAnim ${Math.random() * 3 + 2}s infinite alternate ease-in-out`;
                spark.style.animationDelay = `${Math.random() * 5}s`;
                bgLayer.appendChild(spark);
            }
            // Floating Ghost Cards
            for(let i=0; i<8; i++) {
                let card = document.createElement('div');
                card.className = 'ghost-card';
                card.style.left = Math.random() * 90 + 'vw';
                card.style.animation = `bgCardFloat ${Math.random() * 15 + 18}s infinite linear`;
                card.style.animationDelay = `${Math.random() * -20}s`;
                bgLayer.appendChild(card);
            }
        }

        function startGame() {
            initAudio();
            const input = document.getElementById('group-count').value;
            groupsCount = parseInt(input);
            if (groupsCount < 2) groupsCount = 2;
            if (groupsCount > 5) groupsCount = 5;

            scores = Array(groupsCount).fill(0);
            currentGroupIndex = 0;
            currentStageIndex = 0;
            remainingCards = [...Array(30).keys()]; // Fresh deck in order (0 to 29)

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').style.display = 'flex';
            
            updateScoreboard();
            updateTurnDisplay();
        }

        function updateTurnDisplay() {
            const turnEl = document.getElementById('turn-display');
            turnEl.innerText = `Sıra: ${currentGroupIndex + 1}. Grup`;
        }

        function updateScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '';
            
            let maxScore = -1;
            if (scores.some(s => s > 0)) {
                maxScore = Math.max(...scores);
            }

            scores.forEach((score, i) => {
                const isLeader = score === maxScore && score > 0;
                sb.innerHTML += `
                    <div id="score-box-${i}" class="card-bg px-5 py-2 rounded-xl flex items-center gap-3 border-2 transition-all ${isLeader ? 'border-cyan-400 shadow-[0_0_15px_cyan]' : 'border-transparent'}">
                        <span class="font-bold text-gray-200 text-lg">${i+1}. Grup:</span>
                        <span class="text-3xl font-bold text-white w-8 text-center" id="score-val-${i}">${score}</span>
                        <span class="text-2xl transition-all duration-500 ${isLeader ? 'opacity-100 scale-110 drop-shadow-[0_0_8px_cyan]' : 'opacity-0 scale-50 w-0'}">💎</span>
                    </div>
                `;
            });
        }

        function bringCard() {
            if (remainingCards.length === 0) {
                endGame();
                return;
            }

            // Hide bring button
            document.getElementById('btn-bring-card').classList.add('hidden');
            
            // Pick next card sequentially (0 to 29) as requested ("Go in order from 1 to 30")
            const cardId = remainingCards.shift();
            
            currentCardData = storyData[cardId];
            currentStageIndex = 0;

            // Populate Text
            document.getElementById('story-title').innerText = currentCardData.title;
            document.getElementById('story-text').innerText = currentCardData.text;

            const activeCard = document.getElementById('active-card');
            activeCard.classList.remove('hidden');
            activeCard.style.display = 'flex';
            activeCard.classList.remove('scale-out');
            activeCard.classList.add('scale-in');

            showQuestion();
        }

        function showQuestion() {
            const stage = stages[currentStageIndex];
            const dataObj = currentCardData[stage.key];
            
            document.getElementById('question-tag').innerText = stage.title.split(' ')[0];
            document.getElementById('question-title').innerText = `Bu metnin ${stage.title} nedir?`;

            // Prepare options (1 correct, 2 wrong)
            let options = [
                { text: dataObj.c, isCorrect: true },
                { text: dataObj.w[0], isCorrect: false },
                { text: dataObj.w[1], isCorrect: false }
            ];
            
            // Shuffle answers
            options.sort(() => Math.random() - 0.5);

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            
            options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-5 rounded-xl text-lg md:text-xl font-bold border-2 border-gray-300 shadow-sm leading-snug';
                btn.innerText = opt.text;
                btn.onclick = (e) => handleAnswer(opt.isCorrect, btn, e);
                optContainer.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, btnElement, event) {
            // Disable all buttons immediately
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                b.style.pointerEvents = 'none';
                if (b.innerText === currentCardData[stages[currentStageIndex].key].c && !isCorrect) {
                    b.classList.add('correct-answer'); // Highlight correct one anyway
                }
            });

            if (isCorrect) {
                btnElement.classList.add('correct-answer');
                playCorrectSound();
                
                // Diamond Animation & Score Update
                const rect = btnElement.getBoundingClientRect();
                animateDiamond(event.clientX || rect.left + rect.width/2, event.clientY || rect.top + rect.height/2, currentGroupIndex);
                
                // Add score visually after diamond arrives
                setTimeout(() => {
                    scores[currentGroupIndex]++;
                    updateScoreboard();
                }, 900);

            } else {
                btnElement.classList.add('wrong-answer');
                playWrongSound();
                document.body.classList.add('shake-active');
                setTimeout(() => document.body.classList.remove('shake-active'), 500);
            }

            // Next Turn & Stage Logic after 2.5s delay to let users read
            setTimeout(() => {
                advanceTurnAndStage();
            }, 2500);
        }

        function animateDiamond(startX, startY, groupIndex) {
            const diamond = document.createElement('div');
            diamond.className = 'diamond-particle';
            diamond.innerText = '💎';
            diamond.style.left = startX + 'px';
            diamond.style.top = startY + 'px';
            document.body.appendChild(diamond);

            // Wait a frame to ensure starting position is rendered
            requestAnimationFrame(() => {
                const targetBox = document.getElementById(`score-box-${groupIndex}`);
                if(!targetBox) return;
                const targetRect = targetBox.getBoundingClientRect();
                
                setTimeout(() => {
                    diamond.style.left = (targetRect.left + targetRect.width / 2 - 20) + 'px';
                    diamond.style.top = (targetRect.top + targetRect.height / 2 - 20) + 'px';
                    diamond.style.transform = 'scale(0.5)';
                }, 50);

                setTimeout(() => {
                    diamond.remove();
                }, 850);
            });
        }

        function advanceTurnAndStage() {
            // ALWAYS pass turn to NEXT group on EVERY question
            currentGroupIndex = (currentGroupIndex + 1) % groupsCount;
            updateTurnDisplay();

            currentStageIndex++;
            if (currentStageIndex >= 4) {
                // All 4 questions answered. Card Finished.
                const activeCard = document.getElementById('active-card');
                activeCard.classList.remove('scale-in');
                activeCard.classList.add('scale-out');
                
                setTimeout(() => {
                    activeCard.classList.add('hidden');
                    activeCard.style.display = 'none';
                    document.getElementById('btn-bring-card').classList.remove('hidden');
                    
                    if (remainingCards.length === 0) {
                        endGame();
                    }
                }, 400); // match scaleOut duration
            } else {
                // Next question on same card
                showQuestion();
            }
        }

        function endGame() {
            document.getElementById('game-ui').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            endScreen.style.display = 'flex';

            // Calculate Ranks
            let results = scores.map((score, index) => ({ group: index + 1, score: score }));
            results.sort((a, b) => b.score - a.score);

            const finalSb = document.getElementById('final-scoreboard');
            finalSb.innerHTML = '';
            
            results.forEach((res, idx) => {
                let medal = idx === 0 ? '👑' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '👏';
                finalSb.innerHTML += `
                    <div class="flex justify-between items-center bg-white/10 p-5 rounded-xl border border-white/20 hover:bg-white/20 transition-colors">
                        <span class="font-bold flex items-center gap-3"><span class="text-3xl">${medal}</span> ${res.group}. Grup</span>
                        <span class="text-3xl font-bold text-yellow-400">${res.score} Puan</span>
                    </div>
                `;
            });

            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ffd700', '#ff0000', '#00ff00', '#0000ff', '#ff00ff', '#00ffff'];
            for(let i=0; i<150; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = Math.random() * 12 + 6 + 'px';
                conf.style.height = conf.style.width;
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = -20 + 'px';
                conf.style.opacity = Math.random() + 0.5;
                conf.style.zIndex = 100;
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                
                let duration = Math.random() * 3 + 2;
                conf.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*300 - 150}px, 110vh, 0) rotate(${Math.random()*1080}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    delay: Math.random() * 2000,
                    iterations: Infinity
                });
                
                document.getElementById('end-screen').appendChild(conf);
            }
        }

        // Init setup on load
        window.onload = () => {
            createBackgroundEffects();
        };

    </script>
