<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deyim Eşleştirme: Seviye Destanı v4.1</title>
    <style>
        :root { 
            --gold: #ffd700; --neon: #00f3ff; --danger: #ff003c; --success: #00ff66;
            --bg: #0b0b0e; --card-bg: #1a1a24;
        }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: flex-start; margin: 0; padding: 20px; gap: 20px; min-height: 100vh; overflow: hidden; transition: background 1s ease; user-select: none; }

        /* ANA OYUN ALANI */
        #game-board { flex: 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 25px; border: 3px solid var(--neon); min-height: 80vh; align-content: center; }

        .card { background: var(--card-bg); border: 2px solid #333; border-radius: 12px; padding: 10px; height: 90px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); color: #fff; }
        .card:hover { transform: scale(1.02); border-color: var(--neon); }
        .card.selected { border-color: var(--gold); background: #2a2a35; box-shadow: 0 0 20px var(--gold); }
        .card.matched { visibility: hidden; opacity: 0; pointer-events: none; }
        .card.wrong { animation: shake 0.4s; border-color: var(--danger); background: #3a1a1a; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        /* ALTIN PARLAMA (LEVEL 4) */
        .gold-glow { border-color: var(--gold) !important; box-shadow: 0 0 15px var(--gold) !important; animation: goldPulse 2s infinite; }
        @keyframes goldPulse { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 30px var(--gold); } 100% { opacity: 0.8; } }

        /* SAĞ PANEL */
        #right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; max-width: 380px; }
        .score-card { background: #1a1a1a; padding: 15px; border-radius: 20px; border-left: 10px solid #444; transition: 0.4s; }
        .active-turn { border-left-color: var(--success); box-shadow: 0 0 25px rgba(0,255,102,0.3); transform: scale(1.05); }
        .score-val { font-size: 2.2rem; font-weight: 900; color: var(--gold); }
        
        .t-btn { width: 50px; height: 50px; font-size: 1.8rem; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        .plus { background: var(--success); } .minus { background: var(--danger); color: white; }

        #setup-screen, #final-screen { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-start { padding: 20px 50px; font-size: 2rem; background: var(--success); border: none; border-radius: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-start:hover { transform: scale(1.05); }
        .btn-end { background: var(--danger); color: white; padding: 15px; font-size: 1.5rem; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; margin-top: auto; transition: 0.2s; }
        .btn-end:hover { background: #cc0030; transform: scale(1.05); }

        #level-indicator { font-size: 2rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px #000; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1 style="color:var(--gold); font-size: 3.5rem;">DEYİM DESTANI ⚔️</h1>
    <p>4 Seviyeli Eşleştirme Yarışı</p>
    <div style="margin: 20px;">
        Grup Sayısı: 
        <select id="group-count" style="font-size: 1.5rem; padding: 10px; border-radius: 10px;">
            <option value="2">2 Grup</option><option value="3">3 Grup</option><option value="4" selected>4 Grup</option>
        </select>
    </div>
    <button class="btn-start" onclick="initGame()">DESTANI BAŞLAT</button>
</div>

<div id="game-board" style="display:none"></div>

<div id="right-panel" style="display:none">
    <div id="level-indicator">LEVEL 1</div>
    <div id="turn-info" style="font-size: 1.5rem; text-align: center; color: var(--neon); margin-bottom: 10px; font-weight: bold;">GRUP A SIRASI</div>
    <div id="scores-container"></div>
    <button class="btn-end" onclick="endGame()">OYUNU BİTİR</button>
</div>

<div id="final-screen" style="display:none">
    <h1 style="color:var(--gold); font-size: 4rem;">DESTAN TAMAMLANDI</h1>
    <div id="winner-box" style="font-size: 2rem; text-align: center;"></div>
    <button class="btn-start" style="margin-top: 40px;" onclick="location.reload()">YENİDEN BAŞLA</button>
</div>

<script>
    const allLevels = [
        // Level 1: Temel
        [
            {a: "Gözden düşmek", b: "Pabucu dama atılmak"}, {a: "Ağzı kulaklarına varmak", b: "Etekleri zil çalmak"},
            {a: "Küplere binmek", b: "Tepesi atmak"}, {a: "Etekleri tutuşmak", b: "Eli ayağına dolaşmak"},
            {a: "Can kulağıyla dinlemek", b: "Kulak kesilmek"}, {a: "Dili tutulmak", b: "Lal kesilmek"},
            {a: "Burnunda tütmek", b: "Yüreği sızlamak"}, {a: "Can atmak", b: "Dört gözle beklemek"},
            {a: "Başa kakmak", b: "Yüzüne vurmak"}, {a: "Pestili çıkmak", b: "Takatten düşmek"}
        ],
        // Level 2: Orta
        [
            {a: "Saman altından su yürütmek", b: "Gizli kapaklı iş yapmak"}, {a: "Burnu havada olmak", b: "Kendini dev aynasında görmek"},
            {a: "Çantada keklik", b: "Tereyağından kıl çeker gibi"}, {a: "Göz boyamak", b: "Dostlar alışverişte görsün"},
            {a: "İnce eleyip sık dokumak", b: "Kılı kırk yarmak"}, {a: "Dili pabuç kadar", b: "Ağzına geleni söylemek"},
            {a: "Gözü yükseklerde olmak", b: "Büyük oynamak"}, {a: "Kulak ardı etmek", b: "Nuh deyip peygamber dememek"},
            {a: "Ayıkla pirincin taşını", b: "İşler sarpa sarmak"}, {a: "Hapı yutmak", b: "Çıra gibi yanmak"}
        ],
        // Level 3: Zor
        [
	    {a: "Ağırdan almak", b: "İşi yokuşa sürmek"}, {a: "Kulağına küpe olmak", b: "Ders çıkarmak"},
            {a: "Sinekten yağ çıkarmak", b: "Yoktan var etmek"}, {a: "Ekmek aslanın ağzında", b: "Maişet derdi"},
            {a: "Ekmeğine yağ sürmek", b: "İşine gelmek"}, {a: "Baltayı taşa vurmak", b: "Pot kırmak"},
            {a: "Devede kulak", b: "İncir çekirdeğini doldurmaz"}, {a: "Gemileri yakmak", b: "Geri dönüşü olmamak"},
            {a: "Başının etini yemek", b: "Dır dır etmek"}, {a: "Havlu atmak", b: "Pes etmek"}
        ],
        // Level 4: Efsane (Altın Seviye)
        [
            {a: "Lafı ağzında gevelemek", b: "Baklayı ağzından çıkarmamak"}, {a: "Nalıncı keseri gibi", b: "Hep kendine yontmak"},
            {a: "Tereciye tere satmak", b: "Bilene akıl vermek"}, {a: "Zurnanın zırt dediği yer", b: "En kritik nokta"},
            {a: "Eski hamam eski tas", b: "Değişen bir şey olmamak"}, {a: "Pişmiş kelle gibi gülmek", b: "Yersiz sırıtmak"},
            {a: "Abdalın malı meydanda", b: "Gizlisi saklısı olmamak"}, {a: "Akıntıya kürek çekmek", b: "Beyhude uğraşmak"},
            {a: "Mantar gibi bitmek", b: "Hızla çoğalmak"}, {a: "Sütten ağzı yanmak", b: "Yoğurdu üfleyerek yemek"}
        ]
    ];

    let groups = {}; let order = []; let turn = 0; 
    let currentLevel = 0; let matchedCount = 0; let selectedCards = [];
    let lastClickTime = 0; let audioCtx;

    const levelStyles = [
        {bg: "#0b3d0b", card: "#1e4d1e", border: "#00ff66"}, // L1: Yeşil
        {bg: "#1a0b3d", card: "#2a1a4d", border: "#8e44ad"}, // L2: Mor
        {bg: "#2b0505", card: "#3d0a0a", border: "#ff003c"}, // L3: Kırmızı
        {bg: "#000000", card: "#111111", border: "#ffd700"}  // L4: Altın
    ];

    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(f, t, d) {
        initAudio(); const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = t; o.frequency.value = f; g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    }

    function initGame() {
        initAudio();
        const count = document.getElementById('group-count').value;
        const names = ['A','B','C','D'];
        for(let i=0; i<count; i++) { groups[names[i]] = 0; order.push(names[i]); }
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-board').style.display = 'grid';
        document.getElementById('right-panel').style.display = 'flex';
        loadLevel();
    }

    function loadLevel() {
        const board = document.getElementById('game-board');
        board.innerHTML = "";
        matchedCount = 0;
        selectedCards = [];
        
        const style = levelStyles[currentLevel];
        document.body.style.background = style.bg;
        board.style.borderColor = style.border;
        document.getElementById('level-indicator').innerText = `LEVEL ${currentLevel + 1}`;
        document.getElementById('level-indicator').style.color = style.border;

        let deck = [];
        allLevels[currentLevel].forEach((p, idx) => {
            deck.push({text: p.a, id: idx}); deck.push({text: p.b, id: idx});
        });
        deck.sort(() => Math.random() - 0.5);

        deck.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            if(currentLevel === 3) card.classList.add('gold-glow');
            card.style.backgroundColor = style.card;
            card.innerText = item.text;
            card.dataset.id = item.id;
            card.onclick = () => handleCardClick(card);
            board.appendChild(card);
        });
        updateUI();
    }

    function handleCardClick(card) {
        if(selectedCards.length === 2 || card.classList.contains('selected') || card.classList.contains('matched')) return;
        
        playSound(400 + (currentLevel*100), 'sine', 0.1);
        card.classList.add('selected');
        selectedCards.push(card);

        if(selectedCards.length === 1) lastClickTime = Date.now();

        if(selectedCards.length === 2) {
            // İkinci karta tıklandığında kontrolü biraz bekletiyoruz ki oyuncu ne seçtiğini görsün
            setTimeout(checkMatch, 400);
        }
    }

    function checkMatch() {
        const [c1, c2] = selectedCards;
        const activeGroup = order[turn];
        
        if(c1.dataset.id === c2.dataset.id) {
            // DOĞRU EŞLEŞTİRME
            playSound(800, 'sine', 0.3);
            c1.classList.add('matched'); c2.classList.add('matched');
            
            let baseScore = 10;
            let solveTime = Date.now() - lastClickTime;
            if(solveTime < 2500) baseScore += 5; // Hız bonusu (Gizli)
            
            groups[activeGroup] += baseScore;
            matchedCount++;
            
            // Sırayı otomatik geçir
            turn = (turn + 1) % order.length;
            selectedCards = [];
            updateUI();

            if(matchedCount === 10) {
                currentLevel++;
                if(currentLevel < 4) setTimeout(loadLevel, 1000);
                else setTimeout(endGame, 1000);
            }
        } else {
            // YANLIŞ EŞLEŞTİRME
            playSound(100, 'square', 0.4);
            c1.classList.add('wrong'); c2.classList.add('wrong');
            // Puan düşmüyoruz (0 puan)
            
            setTimeout(() => {
                c1.classList.remove('selected', 'wrong');
                c2.classList.remove('selected', 'wrong');
                selectedCards = [];
                // Sırayı otomatik geçir
                turn = (turn + 1) % order.length; 
                updateUI();
            }, 800);
        }
    }

    function updateUI() {
        document.getElementById('turn-info').innerText = `SIRA: GRUP ${order[turn]}`;
        let html = "";
        order.forEach((id, idx) => {
            const active = (idx === turn) ? 'active-turn' : '';
            html += `
                <div class="score-card ${active}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size: 1.2rem;">GRUP ${id}</span>
                        <span class="score-val">${groups[id]}</span>
                    </div>
                    <div style="margin-top:10px; display:flex; gap:10px">
                        <button class="t-btn minus" onclick="modScore('${id}', -1)">-</button>
                        <button class="t-btn plus" onclick="modScore('${id}', 1)">+</button>
                    </div>
                </div>`;
        });
        document.getElementById('scores-container').innerHTML = html;
    }

    function modScore(id, amt) { groups[id] += amt; updateUI(); }

    function endGame() {
        document.getElementById('final-screen').style.display = 'flex';
        let sorted = order.slice().sort((a,b) => groups[b] - groups[a]); // Puanları sırala
        let winStr = "";
        sorted.forEach((id, i) => {
            winStr += `<div style="margin-bottom: 10px; font-size: 1.8rem;">${i+1}. GRUP ${id} - <span style="color:var(--gold)">${groups[id]} Puan</span></div>`;
        });
        document.getElementById('winner-box').innerHTML = `<div style="font-size: 3rem; margin-bottom: 20px;">🏆 LİDER: GRUP ${sorted[0]} 🏆</div>${winStr}`;
        
        // Zafer Müziği
        [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playSound(f, 'sine', 0.4), i*200));
    }
</script>
</body>
</html>
