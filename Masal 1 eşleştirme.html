<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masal Eşleştirme Oyunu (V3)</title>
    <style>
        :root {
            --bg-color: #050a1a;
            --silver: #e0e0e0;
            --gold: #ffd700;
            --diamond: #00ffff;
            --panel-bg: rgba(5, 10, 26, 0.85);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #112244 0%, #050a1a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Kurulum Ekranı */
        #setupScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;
        }
        .setup-title {
            font-size: 3rem; color: var(--gold); margin-bottom: 20px; text-shadow: 0 0 20px var(--gold);
        }
        .group-btn {
            background: #1f3669; color: white; border: 2px solid var(--diamond);
            padding: 15px 40px; font-size: 1.5rem; margin: 10px; border-radius: 15px; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 0 15px var(--diamond);
        }
        .group-btn:hover { background: var(--diamond); color: var(--bg-color); transform: scale(1.1); }

        /* Ana Oyun Ekranı */
        #gameScreen { display: none; padding: 20px; padding-right: 250px; }
        
        #sidePanel {
            position: fixed; top: 20px; right: 20px; width: 220px;
            background: var(--panel-bg); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px; padding: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 100; backdrop-filter: blur(10px);
        }
        .side-title { text-align: center; color: var(--gold); border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2rem; }
        .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; }
        .score-name { font-weight: bold; }
        .score-val { font-size: 1.2rem; color: var(--diamond); font-weight: bold; }
        .btn-sm { background: #333; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-sm.plus { background: #2a9d8f; }
        .btn-sm.minus { background: #e76f51; }

        /* Oyun Yolları */
        .group-lane { margin-bottom: 40px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .lane-title { font-size: 1.5rem; margin-bottom: 15px; border-left: 5px solid white; padding-left: 10px; }
        .animals-container { display: flex; flex-wrap: wrap; gap: 20px; }
        
        .animal-btn {
            font-size: 2.5rem; width: 75px; height: 75px; border-radius: 50%; border: 4px solid;
            background: #111; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s; position: relative;
        }
        .animal-btn.locked { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
        .animal-btn.completed { background: #1a4f3d; border-color: #2a9d8f; opacity: 0.5; filter: grayscale(50%); box-shadow: none !important; }
        .animal-btn.active:hover { transform: scale(1.15) rotate(5deg); }

        .tier-1 { border-color: var(--silver); box-shadow: 0 0 20px var(--silver); }
        .tier-2 { border-color: var(--gold); box-shadow: 0 0 20px var(--gold); }
        .tier-3 { border-color: var(--diamond); box-shadow: 0 0 20px var(--diamond); }
        .turn-indicator { font-size: 2.5rem; color: var(--gold); text-align: center; margin-bottom: 20px; text-shadow: 0 0 15px var(--gold); }

        /* Soru Modalı (Işıltılı) */
        #modalOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        #particlesCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1001;}
        
        .modal-content {
            background: #121a2f; padding: 30px; border-radius: 20px; width: 95%; max-width: 950px;
            z-index: 1002; position: relative; display: flex; flex-direction: column;
            transition: box-shadow 0.3s, border 0.3s;
        }
        .modal-content.glow-1 { box-shadow: 0 0 40px var(--silver), inset 0 0 15px var(--silver); border: 2px solid var(--silver); }
        .modal-content.glow-2 { box-shadow: 0 0 40px var(--gold), inset 0 0 15px var(--gold); border: 2px solid var(--gold); }
        .modal-content.glow-3 { box-shadow: 0 0 40px var(--diamond), inset 0 0 15px var(--diamond); border: 2px solid var(--diamond); }
        
        .modal-header { font-size: 1.8rem; text-align: center; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px; }

        /* Eşleştirme Alanı */
        .match-container { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
        .draggables, .dropzones { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        
        .drag-item {
            background: #202b45; border: 2px solid #5a6b9c; padding: 15px; border-radius: 10px; cursor: grab; 
            text-align: center; font-weight: bold; user-select: none; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: none;
        }
        .drag-item:active { cursor: grabbing; transform: scale(0.98); }

        .drop-zone {
            background: rgba(255,255,255,0.05); border: 2px dashed #5a6b9c; padding: 15px; border-radius: 10px; 
            min-height: 60px; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; cursor: pointer;
        }
        .drop-zone:hover { background: rgba(255,255,255,0.1); }
        .drop-zone.filled { border-style: solid; border-color: #2a9d8f; background: rgba(42, 157, 143, 0.2); }
        .zone-text { font-size: 1rem; line-height: 1.4; flex: 1; pointer-events: none;}
        .filled-text { font-weight: bold; color: #48cae4; font-size: 1.1rem; pointer-events: none;}

        .submit-btn {
            background: #38b000; color: white; font-size: 1.3rem; font-weight: bold; padding: 15px;
            border: none; border-radius: 10px; cursor: pointer; align-self: center; width: 50%;
            box-shadow: 0 0 15px #38b000; transition: transform 0.2s;
        }
        .submit-btn:hover { transform: scale(1.05); }

        .hint-box {
            background: rgba(230, 57, 70, 0.2); border: 1px solid #e63946; color: #ffb3c1;
            padding: 10px 15px; border-radius: 8px; margin-top: 15px; font-size: 1.1rem; text-align: center;
            display: none; font-weight: bold;
        }

        /* Boşluk Doldurma Alanı */
        .fill-container { text-align: center; padding: 30px; }
        .fill-sentence { font-size: 1.6rem; line-height: 1.8; margin-bottom: 30px; }
        .fill-input {
            background: rgba(255,255,255,0.1); border: 2px solid var(--diamond);
            color: var(--diamond); font-size: 1.5rem; padding: 5px 15px; border-radius: 10px;
            text-align: center; width: 250px; outline: none; text-shadow: 0 0 5px var(--diamond);
        }

        /* Dokunmatik Hayalet */
        #dragGhost {
            position: fixed; pointer-events: none; z-index: 9999; display: none;
            background: #e09f3e; color: white; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem;
        }

        /* Tam Ekran Uyarı Animasyonları */
        #alertOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .alert-emoji { font-size: 8rem; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; margin-bottom: 20px;}
        .alert-text { font-size: 3rem; font-weight: bold; text-shadow: 0 0 20px; animation: fadeIn 0.5s forwards;}

        @keyframes popIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% {transform: rotate(0deg);} 25% {transform: rotate(-15deg) scale(1.2);} 75% {transform: rotate(15deg) scale(1.2);} }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>

           SES EFEKTLERİ (Web Audio API)

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, vol, duration, delay = 0) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
                osc.start(audioCtx.currentTime + delay);
                osc.stop(audioCtx.currentTime + delay + duration);
            } catch(e){}
        }

        function playSuccessSound() {
            playTone(523.25, 'sine', 0.2, 0.5, 0);    
            playTone(659.25, 'sine', 0.2, 0.5, 0.15); 
            playTone(783.99, 'sine', 0.2, 0.5, 0.3);  
            playTone(1046.50, 'sine', 0.2, 1.0, 0.45);
        }

        function playFailSound() {
            playTone(300, 'sawtooth', 0.2, 0.2, 0);
            playTone(250, 'square', 0.2, 0.2, 0.15);
            playTone(350, 'sawtooth', 0.2, 0.2, 0.3);
            playTone(200, 'square', 0.3, 0.4, 0.45);
            playTone(150, 'sawtooth', 0.4, 0.6, 0.6);
        }

            [{l:"Hayvanlara İnsan Özelliği",r:"Toplumdaki açgözlülük, kibir gibi zaafları daha kolay eleştirmek içindir"}, {l:"Devler ve Cadılar",r:"İnsanın hayattaki büyük engellerini ve korkularını simgeler"}, {l:"Peri ve Prens",r:"İyiliği, saflığı ve kurtuluş umudunu temsil eder"}, {l:"Sihirli Eşyalar",r:"Çaresiz kalındığında mucizevi çözümler üretir"}, {l:"Mekânın Kaf Dağı Olması",r:"Ulaşılması en zor olan hayali hedefi betimler"}],
            [{l:"Mesel",r:"Arapça kökenli 'hikâye, örnek' sözcüğü"}, {l:"Milattan Önce",r:"Masalların ortaya çıkışının dayandığı çağlar"}, {l:"Sözlü Gelenek",r:"Yazı kullanılmadan dilden dile aktarım"}, {l:"Ortak Bellek",r:"Halkın asırlarca biriktirdiği tecrübe ve hayal havuzu"}, {l:"Kıssadan Hisse",r:"Masal bitiminde alınması gereken ana ahlaki ders"}],
            [{l:"Ödül Sistemi",r:"Doğru, dürüst ve alçakgönüllü olanın mutlu sona ulaşması"}, {l:"Ceza Sistemi",r:"Kibirli, açgözlü ve yalancı olanın felakete sürüklenmesi"}, {l:"Olay Örgüsü",r:"Gerçekleşmesi imkansız zincirleme vakalar bütünü"}, {l:"Dinleyici Kitlesi",r:"Çoğunlukla çocuklar olmakla birlikte eskiden tüm halk"}, {l:"Temel Motif",r:"Evrensel doğruların fantastik bir örtüyle sunulması"}]
        ];

        const hardFillPool = [
            { text: "Masallar zıt kavramların mücadelesi üzerine kurulur, masalın sonunda istisnasız _____ ödüllendirilir.", ans: ["iyiler", "iyi"] },
            { text: "Masallarda, dinleyiciyi olağanüstü atmosfere hazırlamak için en başta söylenen kalıp sözlere _____ denir.", ans: ["tekerleme", "döşeme"] },
            { text: "Masallarda dil yalın ve sadedir; uzun betimlemeler ve kapalı _____ ifadelere yer verilmez.", ans: ["sanatlı", "sanatli"] },
            { text: "Masallarda belirli bir millete veya dine özgü ögeler yer almaz. Erdemler tüm insanlığı ilgilendirdiği için masallar _____.", ans: ["evrenseldir", "evrensel"] },
            { text: "İnsan karakterinin başka canlılarla sembolize edildiği masallara _____ masalları denir.", ans: ["hayvan", "hayvanlar"] },
            { text: "Olayların karmaşıklaştığı, kahramanın engellerle yüzleştiği ve merakın zirveye çıktığı ana gelişme bölümüne _____ adı verilir.", ans: ["düğüm", "dugum"] },
            { text: "Masal sözcüğü dilimize Arapçada ibret verici söz ve örnek anlamına gelen _____ kelimesinden geçmiştir.", ans: ["mesel"] },
            { text: "Ahlak kuralını aşılamayı hedeflediği için masallar _____ (öğretici) eserlerdir.", ans: ["didaktik"] }
        ];

        const animals = ["🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐙","🐵","🐧","🦉","🦄","🐝", "🐢", "🦕", "🦚"];

        /* -------------------------------------------------------------
           OYUN SİSTEMİ
           ------------------------------------------------------------- */
        let groups = [];
        let currentGroupIndex = 0;
        let totalGroups = 0;

        function popRandom(array) {
            if (array.length === 0) return null;
            return array.splice(Math.floor(Math.random() * array.length), 1)[0];
        }

        function startGame(numGroups) {
            audioCtx.resume();
            totalGroups = numGroups;
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            let sPool = [...simplePool];
            let mPool = [...mediumPool];
            let hMatchPool = [...hardMatchPool];
            let hFillPool = [...hardFillPool];
            let animalIcons = [...animals];

            for (let i = 0; i < numGroups; i++) {
                let animalIndex = Math.floor(Math.random() * animalIcons.length);
                let animalEmoji = animalIcons.splice(animalIndex, 1)[0];

                groups.push({
                    name: `Grup ${i+1} (${animalEmoji})`,
                    score: 0,
                    currentIndex: 0,
                    questions: []
                });

                document.getElementById('scoreContainer').innerHTML += `
                    <div class="score-row">
                        <span class="score-name">${animalEmoji} Grup ${i+1}</span>
                        <div>
                            <button class="btn-sm minus" onclick="manualScore(${i}, -1)">-</button>
                            <span class="score-val" id="score-${i}">0</span>
                            <button class="btn-sm plus" onclick="manualScore(${i}, 1)">+</button>
                        </div>
                    </div>
                `;

                let laneHTML = `<div class="group-lane"><h3 class="lane-title">${animalEmoji} Grup ${i+1} Yolu</h3><div class="animals-container">`;
                
                for (let j = 0; j < 10; j++) {
                    let tier, pts, qData;
                    
                    // Düzeltme: qData paketlemesi tamamen sorunsuz hâle getirildi. Çifte sarma (double wrap) sorunu çözüldü.
                    if (j < 3) { 
                        tier = 1; pts = 1; 
                        qData = { type: 'match', data: popRandom(sPool) }; 
                    } else if (j < 6) { 
                        tier = 2; pts = 2; 
                        qData = { type: 'match', data: popRandom(mPool) }; 
                    } else if (j < 8) { 
                        tier = 3; pts = 3; 
                        qData = { type: 'match', data: popRandom(hMatchPool) }; 
                    } else { 
                        tier = 3; pts = 3; 
                        qData = { type: 'fill', data: popRandom(hFillPool) }; 
                    }
                    
                    groups[i].questions.push({ tier, pts, qData, failedAttempts: 0 });

                    let tierClass = tier === 1 ? 'tier-1' : (tier === 2 ? 'tier-2' : 'tier-3');
                    let lockState = j === 0 && i === 0 ? 'active' : 'locked';
                    
                    let stepEmoji = animalIcons.splice(Math.floor(Math.random() * animalIcons.length), 1)[0];
                    if(animalIcons.length < 5) animalIcons = [...animals]; 
                    
                    laneHTML += `<div class="animal-btn ${tierClass} ${lockState}" id="btn-${i}-${j}" onclick="openQuestion(${i}, ${j})">${stepEmoji}</div>`;
                }
                laneHTML += `</div></div>`;
                document.getElementById('lanesContainer').innerHTML += laneHTML;
            }
            updateTurnUI();
        }

        function manualScore(grpIndex, val) {
            groups[grpIndex].score += val;
            document.getElementById(`score-${grpIndex}`).innerText = groups[grpIndex].score;
        }

        function updateTurnUI() {
            document.getElementById('turnIndicator').innerText = `Sıra: ${groups[currentGroupIndex].name}`;
            for (let i = 0; i < groups.length; i++) {
                let currQ = groups[i].currentIndex;
                for(let j = 0; j < 10; j++) {
                    let btn = document.getElementById(`btn-${i}-${j}`);
                    if (!btn.classList.contains('completed')) {
                        if (i === currentGroupIndex && j === currQ) {
                            btn.classList.remove('locked');
                            btn.classList.add('active');
                        } else {
                            btn.classList.add('locked');
                            btn.classList.remove('active');
                        }
                    }
                }
            }
        }

        /* -------------------------------------------------------------
           SORU ARAYÜZÜ (MODAL) VE MEKANİKLER
           ------------------------------------------------------------- */
        let activeGroupIndex = 0;
        let activeQuestionTier = 1;

        function openQuestion(grpIndex, qIndex) {
            if(grpIndex !== currentGroupIndex) return;
            activeGroupIndex = grpIndex;
            let qObj = groups[grpIndex].questions[qIndex];
            activeQuestionTier = qObj.tier;
            
            let modalBox = document.getElementById('modalBox');
            modalBox.className = 'modal-content glow-' + activeQuestionTier;
            
            document.getElementById('modalOverlay').style.display = 'flex';
            drawParticles(activeQuestionTier);
            
            let modalHeader = document.getElementById('modalHeader');
            let color = activeQuestionTier === 1 ? 'var(--silver)' : (activeQuestionTier === 2 ? 'var(--gold)' : 'var(--diamond)');
            modalHeader.style.color = color;
            modalHeader.innerText = activeQuestionTier === 1 ? "Gümüş Soru (1 Puan)" : (activeQuestionTier === 2 ? "Altın Soru (2 Puan)" : "Elmas Soru (3 Puan)");

            // İpucu Gösterimi
            let hintBox = document.getElementById('hintBox');
            if (qObj.failedAttempts > 0) {
                let hintTxt = "";
                if(qObj.qData.type === 'match') {
                    hintTxt = `💡 İpucu: "${qObj.qData.data[0].l}" kavramı, "${qObj.qData.data[0].r}" ile eşleşmelidir.`;
                } else {
                    let hChar = qObj.qData.data.ans[0].substring(0,3);
                    hintTxt = `💡 İpucu: Cevabın ilk harfleri "${hChar}..." şeklindedir.`;
                }
                hintBox.innerText = hintTxt;
                hintBox.style.display = 'block';
            } else {
                hintBox.style.display = 'none';
            }

            if (qObj.qData.type === 'match') {
                renderMatchQuestion(qObj.qData.data);
            } else {
                renderFillQuestion(qObj.qData.data);
            }
        }

        function renderMatchQuestion(pairs) {
            let leftItems = [...pairs].sort(() => Math.random() - 0.5);
            let rightItems = [...pairs].sort(() => Math.random() - 0.5);

            let html = `<div class="match-container"><div class="draggables">`;
            leftItems.forEach(item => {
                html += `<div class="drag-item" data-id="${item.l}" draggable="true" 
                            ondragstart="drag(event)" ontouchstart="handleTouchStart(event)" 
                            ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)">${item.l}</div>`;
            });
            html += `</div><div class="dropzones">`;
            rightItems.forEach(item => {
                html += `<div class="drop-zone" data-target="${item.l}" data-original-text="${item.r}"
                            ondragover="allowDrop(event)" ondrop="drop(event)" onclick="ejectItem(this)">
                            <span class="zone-text">${item.r}</span>
                         </div>`;
            });
            html += `</div></div><button class="submit-btn" onclick="checkMatchSubmit()">Cevapları Kontrol Et ✔️</button>`;
            document.getElementById('modalBody').innerHTML = html;
        }

        function renderFillQuestion(fillData) {
            let parts = fillData.text.split("_____");
            document.getElementById('modalBody').innerHTML = `
                <div class="fill-container">
                    <div class="fill-sentence">
                        ${parts[0]} <input type="text" id="fillInput" class="fill-input" autocomplete="off"> ${parts[1] || ''}
                    </div>
                    <button class="submit-btn" onclick="checkFillSubmit('${fillData.ans.join('|')}')">Cevabı Kontrol Et ✔️</button>
                </div>
            `;
        }

        /* -------------------------------------------------------------
           KONTROL MEKANİZMASI (TAMAM BUTONU)
           ------------------------------------------------------------- */
        function checkMatchSubmit() {
            let zones = document.querySelectorAll('.drop-zone');
            let isComplete = true;
            let isCorrect = true;

            zones.forEach(z => {
                let filledId = z.getAttribute('data-filled-id');
                let targetId = z.getAttribute('data-target');
                if(!filledId) isComplete = false;
                if(filledId !== targetId) isCorrect = false;
            });

            if(!isComplete) {
                alert("Lütfen önce tüm boşlukları eşleştirin!");
                return;
            }

            processResult(isCorrect);
        }

        function checkFillSubmit(ansString) {
            let val = document.getElementById('fillInput').value.trim().toLowerCase();
            let acceptableAnswers = ansString.split('|');
            processResult(acceptableAnswers.includes(val));
        }

        function processResult(isCorrect) {
            document.getElementById('modalOverlay').style.display = 'none';
            cancelAnimationFrame(animId); 
            let qObj = groups[activeGroupIndex].questions[groups[activeGroupIndex].currentIndex];

            if(isCorrect) {
                playSuccessSound();
                let emoji = activeQuestionTier === 1 ? "🥈" : (activeQuestionTier === 2 ? "🥇" : "💎");
                let txt = activeQuestionTier === 1 ? "HARİKA! (Gümüş)" : (activeQuestionTier === 2 ? "MUHTEŞEM! (Altın)" : "EFSANE! (Elmas)");
                let color = activeQuestionTier === 1 ? "var(--silver)" : (activeQuestionTier === 2 ? "var(--gold)" : "var(--diamond)");
                
                showAlert(emoji, txt, color, () => {
                    manualScore(activeGroupIndex, qObj.pts);
                    document.getElementById(`btn-${activeGroupIndex}-${groups[activeGroupIndex].currentIndex}`).classList.add('completed');
                    groups[activeGroupIndex].currentIndex++;
                    nextTurn();
                });
            } else {
                playFailSound();
                qObj.failedAttempts++; 
                showAlert("🦊", "Hahaha! Yanlış Eşleştirme!", "#e76f51", () => {
                    nextTurn();
                }, true); 
            }
        }

        function showAlert(emoji, text, color, callback, isFail = false) {
            let overlay = document.getElementById('alertOverlay');
            let emojiBox = document.getElementById('alertEmoji');
            let textBox = document.getElementById('alertText');
            
            overlay.style.display = 'flex';
            emojiBox.innerText = emoji;
            textBox.innerText = text;
            textBox.style.color = color;
            
            if(isFail) emojiBox.style.animation = "shake 0.4s infinite";
            else emojiBox.style.animation = "popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards";

            setTimeout(() => {
                overlay.style.display = 'none';
                emojiBox.style.animation = "";
                callback();
            }, 2500);
        }

        function nextTurn() {
            currentGroupIndex = (currentGroupIndex + 1) % totalGroups;
            let checkLoops = 0;
            while(groups[currentGroupIndex].currentIndex >= 10 && checkLoops < totalGroups) {
                currentGroupIndex = (currentGroupIndex + 1) % totalGroups;
                checkLoops++;
            }
            if(checkLoops >= totalGroups) {
                alert("Oyun Bitti! Tüm gruplar hedefe ulaştı.");
            } else {
                updateTurnUI();
            }
        }

        /* -------------------------------------------------------------
           SÜRÜKLE BIRAK MANTIKLARI 
           ------------------------------------------------------------- */
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.getAttribute('data-id')); }
        function drop(ev) {
            ev.preventDefault();
            placeItemInZone(ev.dataTransfer.getData("text"), ev.target.closest('.drop-zone'));
        }

        function placeItemInZone(dragId, dropZone) {
            if (!dropZone) return;
            if (dropZone.classList.contains('filled')) ejectItem(dropZone);
            
            dropZone.classList.add('filled');
            dropZone.setAttribute('data-filled-id', dragId);
            dropZone.innerHTML = `<span class="filled-text">✔️ ${dragId}</span><br><span class="zone-text">${dropZone.getAttribute('data-original-text')}</span>`;
            
            let dragEl = document.querySelector(`.drag-item[data-id="${dragId}"]`);
            if(dragEl) dragEl.style.display = 'none';
        }

        function ejectItem(dropZone) {
            if(!dropZone.classList.contains('filled')) return;
            let dragId = dropZone.getAttribute('data-filled-id');
            
            dropZone.classList.remove('filled');
            dropZone.removeAttribute('data-filled-id');
            dropZone.innerHTML = `<span class="zone-text">${dropZone.getAttribute('data-original-text')}</span>`;
            
            let dragEl = document.querySelector(`.drag-item[data-id="${dragId}"]`);
            if(dragEl) dragEl.style.display = 'block';
        }

        /* Dokunmatik Ekran Desteği */
        let draggedElement = null;
        let ghost = document.getElementById('dragGhost');
        function handleTouchStart(e) {
            draggedElement = e.target;
            ghost.innerText = draggedElement.innerText;
            ghost.style.display = 'block';
            moveGhost(e.touches[0]);
        }
        function handleTouchMove(e) {
            e.preventDefault(); moveGhost(e.touches[0]);
        }
        function handleTouchEnd(e) {
            ghost.style.display = 'none';
            if(!draggedElement) return;
            let touch = e.changedTouches[0];
            let targetElem = document.elementFromPoint(touch.clientX, touch.clientY);
            let dropZone = targetElem ? targetElem.closest('.drop-zone') : null;
            if(dropZone) placeItemInZone(draggedElement.getAttribute('data-id'), dropZone);
            draggedElement = null;
        }
        function moveGhost(touch) {
            ghost.style.left = (touch.clientX - 50) + 'px'; ghost.style.top = (touch.clientY - 30) + 'px';
        }

        /* -------------------------------------------------------------
           CANVAS EFEKTLERİ
           ------------------------------------------------------------- */
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animId;

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawParticles(tier) {
            particles = [];
            let color = tier === 1 ? '#e0e0e0' : (tier === 2 ? '#ffd700' : '#00ffff');
            for(let i=0; i<60; i++){
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    r: Math.random() * 4 + 1, vx: (Math.random() - 0.5) * 2.5, vy: Math.random() * -3 - 1
                });
            }
            animateParticles(color);
        }

        function animateParticles(color) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color;
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                p.y += p.vy; p.x += p.vx;
                if(p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
            });
            animId = requestAnimationFrame(() => animateParticles(color));
        }
    </script>
</body>
</html>
